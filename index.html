<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT 文本情绪峰值提取器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>GPT 文本情绪峰值提取器</h1>
      <p class="intro">
        输入一段 GPT 回复，点击“提取重点”，系统会识别 1-3 个最值得强调的点，并在原文里做下划线和高亮。
      </p>

      <label for="inputText">输入文本</label>
      <textarea id="inputText" rows="10" placeholder="把 GPT 的一段文字粘贴到这里..."></textarea>

      <div class="actions">
        <button id="analyzeBtn">提取重点</button>
        <button id="demoBtn" class="secondary">填充示例</button>
      </div>

      <section class="result-section">
        <h2>提取出的 1-3 个重点</h2>
        <ol id="pointsList"></ol>
      </section>

      <section class="result-section">
        <h2>标注后的文本</h2>
        <div id="annotatedText" class="annotated" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
